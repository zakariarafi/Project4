# Parameter bersama semua eksperimen (docs/PRD.md §7). Nilai di sini dipakai
# kecuali file eksperimen atau entri konfigurasi menimpanya. Mengubah nilai
# setelah data pertama terkumpul berarti experiment ID baru.
params:
  prompts: prompts/gsm8k_10.jsonl
  runs: 3
  max_tokens: 256
  temperature: 0.0
  seed: 0
  enable_thinking: false     # Qwen3 non-thinking
  warmup_tokens: 32
  output: data/raw/results.jsonl
  manifest_dir: data/manifests
  power_interval_ms: 100     # D-002
  idle_seconds: 20
  reidle_every: 10           # D-003
  reidle_seconds: 10

# Registry model: alias -> repo Hugging Face + commit yang di-pin.
# Divalidasi lewat Hugging Face API pada 2026-10-24 (T02): semua repo ada dan
